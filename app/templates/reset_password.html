{% extends "base.html" %}

{% block title %}Восстановление пароля — {{ app_name }}{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="container auth-card reveal">
    <h1>Восстановление пароля</h1>
    <p class="muted">
      Укажите email из профиля — мы отправим ссылку для сброса пароля.
    </p>

    <form class="form" data-reset-form novalidate>
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" autocomplete="email" required>
      </label>

      <div class="form-error" data-form-error role="alert" hidden></div>
      <div class="form-success" data-form-success role="status" hidden></div>

      <button class="btn btn-primary btn-block" type="submit">Отправить ссылку</button>
    </form>

    <p class="auth-alt"><a href="/login">Вернуться ко входу</a></p>
  </div>
</section>
{% endblock %}
