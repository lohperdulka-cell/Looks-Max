[project]
name = "facemetric"
version = "0.1.0"
description = "FaceMetric — веб-платформа объективной оценки внешности (looks-max) от VA digital studio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "VA digital studio" }]

# Ядро приложения. Обработка изображений (декодирование, выравнивание по глазам,
# оценка резкости/яркости) и расчёт метрик — базовая функциональность, поэтому
# numpy и OpenCV входят в ядро. Тяжёлые детекторы лица вынесены в extras, чтобы
# приложение поднималось в окружениях без GPU/onnxruntime.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "slowapi>=0.1.9",
    "httpx>=0.27",
    "structlog>=24.4",
    "python-slugify>=8.0",
    "pillow>=11.0",
    "itsdangerous>=2.2",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
# Детекторы лица: InsightFace (106 точек + пол/возраст) и MediaPipe (468 точек).
# Без них работает демо-провайдер (синтетическая сетка) — конвейер проверяем,
# реальные измерения недоступны.
ml = [
    "insightface>=0.7.3",
    "onnxruntime>=1.20",
    "mediapipe>=0.10.18",
    "scikit-learn>=1.5",
]
# Только MediaPipe: ≈240 МБ RSS, влезает в 512 МБ Render free (реальные
# измерения без скачивания 280 МБ весов InsightFace).
mp = [
    "mediapipe>=0.10.18",
]
# Экспорт отчётов в PDF.
pdf = ["weasyprint>=62.3"]
# ИИ-консультант с внешним LLM (OpenAI-совместимый API).
# Без этого extra чат работает на встроенном оффлайн-советнике.
llm = ["openai>=1.55"]
# Разработка и качество кода.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pillow",
    "fakeredis>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
# B008: Depends() в дефолтах FastAPI — норма.
# RUF001/002/003: ложные срабатывания на кириллице в строках/докстрингах.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["alembic/", "app/ml/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
