# Render Blueprint: web-сервис + управляемый PostgreSQL.
# Секреты (SECRET_KEY, JWT_SECRET) Render генерирует сам и хранит вне репозитория.
services:
  - type: web
    name: facemetric
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: BASE_URL
        fromService:
          type: web
          name: facemetric
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: facemetric-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # Render free: 512 МБ RAM. Замеры пика RSS: MediaPipe — 237 МБ (влезает),
      # InsightFace с обрезкой до трёх моделей — 274 МБ, полный buffalo_l —
      # 920 МБ (OOM-kill). Поэтому на free собираем профиль mp и оставляем
      # MediaPipe основным: измерения реальные, пол берётся из профиля
      # (MediaPipe его не отдаёт). Для InsightFace переходите на платный план.
      - key: ML_ENABLED
        value: "true"
      - key: ML_PROVIDER_PRIMARY
        value: mediapipe
      - key: ML_PROVIDER_FALLBACK
        value: demo
      - key: ML_INSIGHTFACE_MODULES
        value: detection,landmark_2d_106,genderage
      - key: ML_PROVIDER_DEMO
        value: "true"
      - key: LLM_ENABLED
        value: "false"
      # Почта для сброса пароля. Оставьте пустыми, если письма не нужны:
      # тогда ссылка сброса пишется в лог, а приложение работает как обычно.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12"

databases:
  - name: facemetric-db
    plan: free
    databaseName: facemetric
    user: facemetric
