# Render Blueprint: web-сервис + управляемый PostgreSQL.
# Секреты (SECRET_KEY, JWT_SECRET) Render генерирует сам и хранит вне репозитория.
services:
  - type: web
    name: facemetric
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: BASE_URL
        fromService:
          type: web
          name: facemetric
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: facemetric-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # Render free: 512 МБ RAM — детекторы лица (InsightFace/MediaPipe) не
      # влезают. Включаем демо-провайдер: конвейер работает целиком, но баллы
      # синтетические. Для реальных измерений переведите сервис на платный план,
      # соберите образ с INSTALL_EXTRAS=full и верните ML_ENABLED=true.
      - key: ML_ENABLED
        value: "true"
      - key: ML_PROVIDER_PRIMARY
        value: demo
      - key: ML_PROVIDER_FALLBACK
        value: demo
      - key: ML_PROVIDER_DEMO
        value: "true"
      - key: LLM_ENABLED
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12"

databases:
  - name: facemetric-db
    plan: free
    databaseName: facemetric
    user: facemetric
