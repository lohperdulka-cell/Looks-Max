services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facemetric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facemetric}
      POSTGRES_DB: ${POSTGRES_DB:-facemetric}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facemetric}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        # mp — MediaPipe (≈240 МБ RSS). full — + InsightFace и PDF.
        INSTALL_EXTRAS: ${INSTALL_EXTRAS:-mp}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-facemetric}:${POSTGRES_PASSWORD:-facemetric}@db:5432/${POSTGRES_DB:-facemetric}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret}
      ML_ENABLED: ${ML_ENABLED:-true}
      ML_PROVIDER_PRIMARY: ${ML_PROVIDER_PRIMARY:-mediapipe}
      ML_PROVIDER_FALLBACK: ${ML_PROVIDER_FALLBACK:-demo}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    volumes:
      - media:/app/data/media
      - models:/app/data/models
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"

volumes:
  pgdata:
  media:
  models:
